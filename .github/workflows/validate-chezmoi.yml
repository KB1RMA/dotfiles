name: Validate chezmoi

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # macOS runner since these templates/scripts target macOS (brew, macOS defaults, etc.)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install chezmoi
        run: brew install chezmoi

      - name: Dry-run apply to a scratch $HOME
        run: |
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/cache"
          chezmoi apply \
            --source "$GITHUB_WORKSPACE" \
            --destination "$RUNNER_TEMP/home" \
            --cache "$RUNNER_TEMP/cache" \
            --force --dry-run --verbose

      # Regression test for https://github.com/KB1RMA/dotfiles/issues/4:
      # `chezmoi apply --dry-run` never executes .chezmoiscripts, so it can't
      # catch runtime failures in them (e.g. npm not being on PATH after nvm
      # install). Run the nvm/npm scripts for real and confirm npm works.
      - name: Run nvm/npm install scripts for real
        run: |
          bash .chezmoiscripts/run_once_20_install_nvm.sh
          bash .chezmoiscripts/run_once_30_install_npm_globals.sh

          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

          command -v npm
          npm --version
          for pkg in typescript typescript-language-server eslint_d; do
            npm list -g "$pkg" >/dev/null
          done
